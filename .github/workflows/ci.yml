name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Tests
        env:
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation-0000
          ENVIRONMENT: test
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Dependency audit
        run: |
          uv export --format requirements-txt --no-hashes --no-dev --output-file requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt

  frontend:
    name: Frontend (lint, types, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test -- --runInBand --coverage

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  docker:
    name: Backend image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag money-tracker-api:ci ./backend

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
