name: Bug report
description: Report reproducible incorrect behaviour
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** include access tokens, passwords,
        refresh tokens, or personal financial data. For security issues, follow
        SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the backend with ...
        2. Sign in as ...
        3. Open ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Authentication / sessions
        - Mobile app (iOS)
        - Mobile app (Android)
        - Web build
        - Documentation / tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Node, Expo Go / emulator version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, emails, and amounts.
      render: shell
