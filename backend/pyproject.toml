[project]
name = "money-tracker-api"
version = "0.1.0"
description = "FastAPI backend for the Money Tracker app."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.16.0",
    "fastapi[standard]>=0.120",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (security)
    "ASYNC", # async correctness
    "C4",    # comprehensions
    "PT",    # pytest style
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# The test suite sets environment variables before importing the app.
"tests/conftest.py" = ["E402"]
# Tests intentionally use asserts, literal passwords, and fixed fake secrets.
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "app/*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^migrations/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
